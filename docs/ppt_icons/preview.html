<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>02 使用场景 · 四张标签图预览（PNG 版）</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 0; background: #1a1a2e; color: #fff; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
  h1 { font-size: 20px; font-weight: 600; }
  p.tip { color: #c7b8e0; font-size: 13px; line-height: 1.8; }
  .stage {
    display: flex; gap: 12px; padding: 28px 20px; border-radius: 14px;
    background: linear-gradient(135deg, #2E1065 0%, #86198F 55%, #C026D3 100%);
    justify-content: space-around; margin-bottom: 28px;
  }
  .stage.light { background: #f6f2fb; }
  .item { text-align: center; width: 130px; }
  .item img { width: 76px; height: 76px; }
  .item .cap { margin-top: 10px; font-size: 13px; line-height: 1.5; }
  .stage.light .item .cap { color: #3b1d5e; }
  .label { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 999px;
           background: rgba(255,255,255,.14); margin-bottom: 18px; letter-spacing: 1px; }
  .stage.light .label { background: #e9d8fd; color: #6b21a8; }
</style>
</head>
<body>
<div class="wrap">
  <h1>02 使用场景 · 四张标签图预览（PNG 透明底 360×360）</h1>
  <p class="tip">上排 = 实际投在紫色头部上的效果；下排 = 白底核对可读性。PNG 直接「插入 → 图片」，PowerPoint / WPS 任何版本都支持。</p>

  <div class="label">紫色头部（PPT 实际效果）</div>
  <div class="stage">
    <div class="item"><img src="scene1_online.png" alt="线上·电脑"><div class="cap">线上 · 下单前<br>上传照片直接试</div></div>
    <div class="item"><img src="scene2_mall.png" alt="线下·商场"><div class="cap">线下 · 柜台前<br>两个视角对齐一支口红</div></div>
    <div class="item"><img src="scene3_door.png" alt="出门前·门框"><div class="cap">出门前 · 镜子跟前<br>先看一眼"别人眼里的我"</div></div>
    <div class="item"><img src="scene4_chip.png" alt="第一次·芯片"><div class="cap">第一次 · 打开应用<br>22 题建档</div></div>
  </div>

  <div class="label">白底核对</div>
  <div class="stage light">
    <div class="item"><img src="scene1_online.png" alt=""><div class="cap">线上 · 下单前</div></div>
    <div class="item"><img src="scene2_mall.png" alt=""><div class="cap">线下 · 柜台前</div></div>
    <div class="item"><img src="scene3_door.png" alt=""><div class="cap">出门前 · 镜子跟前</div></div>
    <div class="item"><img src="scene4_chip.png" alt=""><div class="cap">第一次 · 打开应用</div></div>
  </div>
</div>
</body>
</html>

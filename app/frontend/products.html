<body>
<header class="site-head">
 <h1><a class="brand" href="/" title="返回主页">ColorBoundless</a></h1>
 <nav class="nav-x">
  <a href="/palette.html">选色</a><span class="sep">|</span><a href="/tryon.html">试妆</a><span class="sep">|</span><a href="/cvd.html">色盲校验</a><span class="sep">|</span><a class="on" href="/products.html">产品库</a>
 </nav>

<p class="sub">产品库 · 所选色号 → 最近集团商品（ΔE ≤ 5 有货，否则可定制）· 伴随 AI 自动调度的目的地</p>

<!-- def 18a · 色号查询器：支持 ?hex=..&region=.. URL 参数（伴随 AI navigate 跳转落点，def 18 通道） -->
<div class="card" id="card-lookup"><b>色号 → 商品匹配</b>
 <div class="row" style="margin-top:8px;align-items:center">
  <input id="qhex" value="#C2185B" size="9" style="font-weight:600" aria-label="色号">
  <select id="qregion" aria-label="部位">
   <option value="lip">唇妆 · 官方库</option>
   <option value="foundation">粉底 · 集团库</option>
  </select>
  <button id="qbtn">查询最近商品</button>
  <span id="qms" class="ms"></span>
 </div>
 <div id="pres" class="res" style="margin-top:10px"></div>
</div>

<!-- def 18a · 商品库浏览：唇妆官方库(20) / 粉底集团库(168) -->
<div class="card" id="card-browse"><b>浏览商品库</b>
 <details open style="margin-top:8px"><summary>唇妆 · 官方库（<span id="lipn">…</span> 色）</summary>
  <div id="lipgrid" class="pgrid"></div></details>
 <details open style="margin-top:6px"><summary>粉底 · 欧莱雅集团库（<span id="fdn">…</span> 色）</summary>
  <div id="fdgrid" class="pgrid"></div></details>
</div>

<!-- def 15d · 定制申请记录（时间线，最新在前） -->
<div class="card" id="card-custom"><b>我的定制申请</b>
 <div id="customlist" class="meta" style="margin-top:8px">加载中…</div>
</div>

<footer>推荐结果一律来自后端数据检索，AI 只负责组织语言——判定依据（CIEDE2000 ΔE ≤ 5 有货）全部可复现。</footer>

<script src="products.js?v=def18a"></script>
</body>
